<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NXL Ultimate</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#060609">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#060609;--card:#12121a;--line:#262633;--mut:#8b8b9c;--a:#ff2a85;--b:#ff7300;--g:linear-gradient(135deg,#ff2a85,#ff7300)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;height:100dvh;display:flex;flex-direction:column;background:var(--bg);color:#fff;font:14px Cairo,system-ui,sans-serif}
button,input,textarea{font:inherit;color:inherit}
input,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;outline:0}
textarea{resize:none;height:64px}
.ltr{direction:ltr;text-align:left}
button{border:0;cursor:pointer;border-radius:12px;padding:9px 14px;background:var(--card);border:1px solid var(--line)}
button:active{transform:scale(.96)}
.g,.btn{background:var(--g);border:0;font-weight:800}
.btn{display:block;width:100%;margin-top:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}
.av{width:36px;height:36px;border-radius:50%;background:#222;object-fit:cover;flex:none}
.big{width:72px;height:72px;border:2px solid var(--a)}
.pimg{max-width:100%;border-radius:12px;display:block;margin-top:6px}
.mut,small{color:var(--mut)}
.un{color:var(--b)}
header{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line)}
main{flex:1;min-height:0;overflow-y:auto}
.tab{display:none;padding:12px;max-width:480px;margin:auto}
.tab.on{display:block}
#t-global.on{display:flex;flex-direction:column;height:100%}
#gmsgs,#pmsgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:8px 0}
.msg{max-width:80%;padding:8px 12px;border-radius:16px;background:var(--card);border:1px solid var(--line);align-self:flex-start;word-break:break-word}
.msg.me{background:var(--g);border:0;align-self:flex-end}
.msg p{margin:0}.msg small{display:block;color:#ffffffa0;font-size:10px}
.bar{display:flex;gap:8px;padding-top:8px}
nav{display:flex;justify-content:space-around;border-top:1px solid var(--line);padding:6px 0 max(6px,env(safe-area-inset-bottom))}
nav button{background:0;border:0;color:var(--mut);font-size:11px;position:relative;padding:4px 10px}
nav button.on{color:var(--a);font-weight:800}
.dot{position:absolute;top:0;right:6px;width:8px;height:8px;background:red;border-radius:50%}
.ov{position:fixed;inset:0;z-index:50;background:#060609f2;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.ov.on{display:flex}
.box{width:100%;max-width:340px;text-align:center}
#pchat{justify-content:flex-start;padding:0;align-items:stretch}
#pchat>*{padding-inline:12px}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:8px 16px;border-radius:20px;z-index:99;display:none;font-weight:600}
#stories{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px}
#stories>div{text-align:center;min-width:64px;font-size:10px}
#stories .av{width:52px;height:52px;border:2px solid var(--a)}
.pill{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:2px 8px;margin-top:2px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:70px}
#aibtn{position:fixed;bottom:76px;left:14px;width:46px;height:46px;border-radius:50%;padding:0;z-index:40}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.grid img{width:100%;height:96px;object-fit:cover;border-radius:10px}
.q{border-inline-start:3px solid var(--a);padding:2px 8px;margin-bottom:4px;font-size:12px;background:#0003;border-radius:6px}.acts{display:flex;gap:12px;font-size:11px;margin-top:4px;opacity:.85}.acts span{cursor:pointer}.rx{display:inline-block;background:#0007;border-radius:10px;padding:0 6px;font-size:12px;margin-top:3px}.bdg{background:var(--a);border-radius:10px;padding:0 8px;font-size:12px;font-weight:800}
[hidden]{display:none!important}
</style>
</head>
<body>

<div id="auth" class="ov on"><div class="box card">
  <h2>NXL Ultimate</h2>
  <input id="em" type="email" class="ltr" placeholder="البريد الإلكتروني" autocomplete="email" style="margin-bottom:8px">
  <input id="pw" type="password" class="ltr" placeholder="كلمة المرور (6 أحرف على الأقل)" autocomplete="current-password">
  <button id="login" class="btn">تسجيل الدخول</button>
  <button id="signup" class="btn" style="background:var(--card);border:1px solid var(--line)">إنشاء حساب</button>
  <button id="forgot" style="background:0;border:0;color:var(--mut);margin-top:6px">نسيت كلمة المرور؟</button>
</div></div>

<div id="setup" class="ov"><div class="box card">
  <h2 id="setup-title">أكمل ملفك الشخصي</h2>
  <input id="s-nick" maxlength="24" placeholder="الاسم الظاهر" style="margin-bottom:8px">
  <input id="s-un" class="ltr" maxlength="20" placeholder="اسم المستخدم (a-z و 0-9 و _)" style="margin-bottom:8px">
  <input id="s-bio" maxlength="100" placeholder="نبذة عنك">
  <button id="s-save" class="btn">حفظ</button>
  <button id="s-cancel" hidden style="margin-top:8px">إلغاء</button>
</div></div>

<header>
  <b>NXL</b>
  <img id="hav" class="av" alt="" hidden>
</header>

<main>
<section id="t-home" class="tab on">
  <div id="stories"></div>
  <div class="card">
    <textarea id="ptxt" maxlength="1000" placeholder="شارك لحظتك... (تختفي بعد 72 ساعة)"></textarea>
    <div class="row" style="justify-content:space-between;margin-top:8px">
      <label><input id="pfile" type="file" accept="image/*" hidden><span class="card" style="padding:6px 12px;margin:0;cursor:pointer">🖼️ صورة</span></label>
      <span id="ppv" hidden>✅ صورة مرفقة <button id="pcancel">✕</button></span>
      <button id="pubpost" class="g">نشر</button>
    </div>
  </div>
  <div class="row" style="justify-content:center;margin-bottom:10px">
    <button id="m-hot" class="g">✨ الرائج</button><button id="m-new">🕒 الأحدث</button>
  </div>
  <div id="feed"></div>
</section>

<section id="t-global" class="tab">
  <small style="text-align:center">رسائل الشات العام تختفي من العرض بعد 24 ساعة</small>
  <div id="gmsgs"></div>
  <div class="bar"><input id="gin" maxlength="500" placeholder="اكتب للجميع..."><button id="gsend" class="g">إرسال</button></div>
</section>

<section id="t-games" class="tab">
  <div class="card"><b>🏆 لوحة الشرف</b><div id="board"></div></div>
  <div class="row"><button class="card" style="flex:1" data-act="quiz" data-id="love">💖 اختبار التوافق</button><button class="card" style="flex:1" data-act="quiz" data-id="secret">💌 صندوق الأسرار</button></div>
  <div id="quiz" class="card" hidden>
    <b id="q-t"></b>
    <input id="q-a" maxlength="80" placeholder="إجابتك" style="margin:8px 0">
    <input id="q-n" maxlength="24" placeholder="اسم الطرف الثاني">
    <button id="q-go" class="btn">إنشاء الكارت</button>
    <div id="q-res" hidden style="text-align:center;margin-top:10px">
      <div id="q-names"></div><div id="q-pct" style="font-size:44px;font-weight:800;color:var(--a)"></div><div id="q-msg"></div>
      <button id="q-dl" class="btn">📥 حفظ / مشاركة كصورة</button>
      <small>النسبة للتسلية فقط</small>
    </div>
  </div>
</section>

<section id="t-chats" class="tab">
  <div class="card row"><input id="note" maxlength="60" placeholder="نوت (تختفي بعد 7 ساعات)"><button id="note-save" class="g">نشر</button></div>
  <input id="srch" class="ltr" placeholder="ابحث باسم المستخدم..." autocomplete="off">
  <div id="sres" style="margin:6px 0"></div>
  <b class="mut">محادثاتك</b>
  <div id="clist" style="margin-top:6px"></div>
</section>

<section id="t-profile" class="tab" style="text-align:center">
  <div class="card">
    <div class="row" style="justify-content:space-between"><button id="edit">تعديل</button><button id="logout" style="color:#ff6b6b">خروج</button></div>
    <img id="pav" class="av big" alt="">
    <h3 id="pnick" style="margin:6px 0 0"></h3><div id="pun" class="un"></div><p id="pbio" class="mut"></p>
    <b id="ppts" style="color:var(--a)"></b>
  </div>
  <div id="mygrid" class="grid"></div>
</section>
</main>

<nav>
  <button data-tab="home" class="on">الرئيسية</button>
  <button data-tab="global">عام<i id="gdot" class="dot" hidden></i></button>
  <button data-tab="games">ألعاب</button>
  <button data-tab="chats">شاتاتي<i id="cdot" class="dot" hidden></i></button>
  <button data-tab="profile">ملفي</button>
</nav>

<div id="pchat" class="ov">
  <div class="row" style="padding-block:10px;border-bottom:1px solid var(--line);width:100%">
    <button id="pback">رجوع</button><img id="pa" class="av" alt="">
    <div style="flex:1"><b id="pn"></b><br><small id="ps"></small></div>
    <button id="pdel" title="إزالة من قائمتي">🗑️</button>
  </div>
  <div id="pmsgs" style="width:100%"></div>
  <div style="width:100%;padding-bottom:max(10px,env(safe-area-inset-bottom))">
    <div id="prep" class="card row" hidden style="margin:6px 0 0;padding:6px 10px"><span id="prept" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px"></span><button id="prepx">✕</button></div>
    <div id="pimgbox" hidden>✅ صورة مرفقة <label><input id="once" type="checkbox"> تُعرض مرة واحدة</label> <button id="pimgx">✕</button></div>
    <div class="bar"><input id="pfile2" type="file" accept="image/*" hidden><button id="pimgbtn">🖼️</button><input id="pin" maxlength="1000" placeholder="اكتب رسالة..."><button id="psend" class="g">إرسال</button></div>
  </div>
</div>

<div id="once-v" class="ov"><p>👻 تختفي الصورة بعد الإغلاق</p><img id="once-img" class="pimg" alt=""><button id="once-x" class="btn" style="max-width:200px">إغلاق</button></div>

<div id="umodal" class="ov"><div class="box card">
  <img id="ua" class="av big" alt=""><h3 id="un1" style="margin:6px 0 0"></h3><div id="un2" class="un"></div>
  <p id="ubio" class="mut"></p><div id="unote" class="card" hidden></div><b id="upts"></b>
  <button id="uchat" class="btn">مراسلة خاصة</button><button id="uclose" class="btn" style="background:var(--card);border:1px solid var(--line)">إغلاق</button>
</div></div>

<button id="aibtn" class="g">AI</button>
<div id="ai" class="ov" style="justify-content:flex-end;padding:0">
  <div class="card" style="width:100%;max-width:480px;height:75vh;display:flex;flex-direction:column;margin:0;border-radius:20px 20px 0 0">
    <div class="row" style="justify-content:space-between"><b>مساعد NXL</b><button id="aix">✕</button></div>
    <div id="amsgs" style="flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:8px 0"></div>
    <div class="bar"><input id="ain" placeholder="اسأل..."><button id="asend" class="g">إرسال</button></div>
  </div>
</div>
<div id="toast"></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import{getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,sendPasswordResetEmail,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import{getDatabase,ref,set,update,push,remove,get,onValue,query,orderByChild,startAt,endAt,limitToLast,limitToFirst,runTransaction,onDisconnect,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const app=initializeApp({apiKey:"AIzaSyDQ8pJMhye-kp5-FjXzVPPw2MDFm9_0A8c",authDomain:"mohamed-fc163.firebaseapp.com",databaseURL:"https://mohamed-fc163-default-rtdb.firebaseio.com",projectId:"mohamed-fc163",storageBucket:"mohamed-fc163.firebasestorage.app",messagingSenderId:"53405639840",appId:"1:53405639840:web:c8ff7cce9d39ade5d555c5"});
const auth=getAuth(app),db=getDatabase(app);
const $=id=>document.getElementById(id);
const H=3600000;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const av=u=>'https://api.dicebear.com/7.x/adventurer/svg?seed='+encodeURIComponent(u||'x');
const rt=p=>ref(db,p);
let me=null,my=null,off=[],started=false,editing=false,mode='hot',posts=[],cur='home',chat=null,chatOff=null,pic={post:'',chat:''},firstG=true,ct=0;
const on=(q,cb)=>off.push(onValue(q,cb));
let tt;const toast=m=>{const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',2500)};
const shrink=f=>new Promise((ok,no)=>{const i=new Image(),u=URL.createObjectURL(f);i.onload=()=>{const k=Math.min(1,480/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.6))};i.onerror=no;i.src=u});

/* ---------- tabs ---------- */
const TABS=['home','global','games','chats','profile'];
function tab(t){cur=t;TABS.forEach(x=>{$('t-'+x).classList.toggle('on',x===t);document.querySelector(`nav [data-tab=${x}]`).classList.toggle('on',x===t)});if(t==='global'){$('gdot').hidden=true;scrollEnd('gmsgs')}}
document.querySelectorAll('nav [data-tab]').forEach(b=>b.onclick=()=>tab(b.dataset.tab));
$('hav').onclick=()=>tab('profile');
const scrollEnd=id=>{const e=$(id);e.scrollTop=e.scrollHeight};

/* ---------- auth ---------- */
const ERR={'auth/invalid-credential':'بيانات غير صحيحة','auth/email-already-in-use':'البريد مستخدم مسبقاً','auth/weak-password':'كلمة المرور ضعيفة','auth/invalid-email':'بريد غير صالح','auth/too-many-requests':'محاولات كثيرة، حاول لاحقاً'};
const go=fn=>{const e=$('em').value.trim(),p=$('pw').value;if(!e||p.length<6)return toast('أدخل بريداً وكلمة مرور (6 أحرف على الأقل)');fn(auth,e,p).catch(x=>toast(ERR[x.code]||'تعذر الدخول، حاول مجدداً'))};
$('login').onclick=()=>go(signInWithEmailAndPassword);
$('signup').onclick=()=>go(createUserWithEmailAndPassword);
$('forgot').onclick=()=>{const e=$('em').value.trim();if(!e)return toast('اكتب بريدك أولاً');sendPasswordResetEmail(auth,e).then(()=>toast('تم إرسال الرابط')).catch(()=>toast('تعذر الإرسال'))};
$('logout').onclick=()=>signOut(auth);

onAuthStateChanged(auth,u=>{
  off.forEach(f=>f());off=[];closeChat(true);started=false;me=u;my=null;
  $('auth').classList.toggle('on',!u);
  if(!u){$('setup').classList.remove('on');$('pchat').classList.remove('on');return}
  on(rt('users/'+u.uid),s=>{
    const v=s.val();
    if(!v||!v.nickname){editing=false;$('setup').classList.add('on');return}
    my=v;if(!editing)$('setup').classList.remove('on');
    paint();if(!started){started=true;start()}
  });
});

/* ---------- profile setup / edit ---------- */
$('s-save').onclick=async()=>{
  const nickname=$('s-nick').value.trim(),bio=$('s-bio').value.trim();
  const un=$('s-un').value.trim().toLowerCase();
  if(!nickname||!bio)return toast('املأ كل الحقول');
  try{
    if(editing){await update(rt('users/'+me.uid),{nickname,bio});editing=false;$('setup').classList.remove('on');return}
    if(!/^[a-z0-9_]{3,20}$/.test(un))return toast('اسم المستخدم: 3-20 حرفاً إنجليزياً أو أرقاماً أو _');
    const r=await runTransaction(rt('usernames/'+un),c=>c===null?me.uid:undefined);
    if(!r.committed&&r.snapshot.val()!==me.uid)return toast('اسم المستخدم محجوز');
    await set(rt('users/'+me.uid),{nickname,username:un,bio,points:0,joinedAt:serverTimestamp(),isOnline:true});
  }catch(e){toast('تعذر الحفظ')}
};
$('edit').onclick=()=>{editing=true;$('setup-title').textContent='تعديل الملف';$('s-nick').value=my.nickname;$('s-bio').value=my.bio;$('s-un').value=my.username;$('s-un').disabled=true;$('s-cancel').hidden=false;$('setup').classList.add('on')};
$('s-cancel').onclick=()=>{editing=false;$('s-un').disabled=false;$('s-cancel').hidden=true;$('setup').classList.remove('on')};

function paint(){
  $('hav').src=av(my.username);$('hav').hidden=false;$('pav').src=av(my.username);
  $('pnick').textContent=my.nickname;$('pun').textContent='@'+my.username;$('pbio').textContent=my.bio||'';$('ppts').textContent=(my.points||0)+' EXP';
  if(document.activeElement!==$('note'))$('note').value=my.note?.text||'';
}

/* ---------- listeners ---------- */
function start(){
  // presence (only after the profile exists)
  on(rt('.info/connected'),s=>{if(s.val()){const r=rt(`users/${me.uid}/isOnline`);onDisconnect(r).set(false).then(()=>set(r,true))}});

  on(rt('.info/serverTimeOffset'),s=>{skew=s.val()||0});

  // posts (72h window, filtered by the server query)
  on(query(rt('posts'),orderByChild('ts'),startAt(Date.now()-72*H),limitToLast(50)),s=>{posts=[];s.forEach(c=>{posts.push({...c.val(),id:c.key})});renderFeed()});

  // global chat (24h)
  firstG=true;
  on(query(rt('global_chat'),orderByChild('ts'),startAt(Date.now()-24*H),limitToLast(100)),s=>{
    let h='',last=null;
    s.forEach(c=>{const m=c.val(),mine=m.uid===me.uid;last=m;
      h+=`<div class="msg ${mine?'me':''}"><small data-act="user" data-id="${esc(m.uid)}" style="cursor:pointer">${esc(m.nick)}</small><p>${esc(m.text)}</p></div>`});
    $('gmsgs').innerHTML=h||'<p class="mut" style="text-align:center">لا رسائل بعد</p>';scrollEnd('gmsgs');
    if(!firstG&&cur!=='global'&&last&&last.uid!==me.uid)$('gdot').hidden=false;
    firstG=false;
  });

  // leaderboard
  on(query(rt('users'),orderByChild('points'),limitToLast(10)),s=>{
    const a=[];s.forEach(c=>{a.push({...c.val(),uid:c.key})});a.reverse();
    $('board').innerHTML=a.map((u,i)=>`<div class="row" data-act="user" data-id="${esc(u.uid)}" style="padding:6px 0;cursor:pointer"><b>${['👑','🥈','🥉'][i]||'#'+(i+1)}</b><img class="av" src="${av(u.username)}" alt=""><div style="flex:1">${esc(u.nickname)}<br><small>@${esc(u.username)}</small></div><b style="color:var(--a)">${u.points||0}</b></div>`).join('');
  });

  // notes (7h)
  on(query(rt('users'),orderByChild('note/ts'),startAt(Date.now()-7*H)),s=>{
    const a=[];s.forEach(c=>{const u=c.val();if(u.note?.text)a.push({...u,uid:c.key})});
    $('stories').innerHTML=a.map(u=>`<div data-act="user" data-id="${esc(u.uid)}"><img class="av" src="${av(u.username)}" alt=""><div>${esc(u.nickname.split(' ')[0])}</div><span class="pill">${esc(u.note.text)}</span></div>`).join('');
  });

  // private chats list
  on(rt('user_chats/'+me.uid),async s=>{
    const t=++ct,es=[];s.forEach(c=>{const v=c.val();if(v&&v.with)es.push({...v,cid:c.key})});
    es.sort((a,b)=>(b.ts||0)-(a.ts||0));
    const tot=es.reduce((n,e)=>n+(e.unread||0),0);
    $('cdot').hidden=!tot;document.title=(tot?`(${tot}) `:'')+'NXL Ultimate';
    if(chat)for(const e of es)if(e.cid===chat.id&&e.unread)set(rt(`user_chats/${me.uid}/${e.cid}/unread`),0).catch(()=>{});
    const us=await Promise.all(es.map(e=>get(rt('users/'+e.with)).then(x=>x.val()?{...x.val(),...e,uid:e.with}:null).catch(()=>null)));
    if(t!==ct)return;
    $('clist').innerHTML=us.filter(Boolean).map(u=>`<div class="card row" data-act="chat" data-id="${esc(u.uid)}" style="cursor:pointer"><img class="av" src="${av(u.username)}" alt=""><div style="flex:1;min-width:0"><b>${esc(u.nickname)}</b><br><small>${esc(u.last||'@'+u.username)}</small></div>${u.unread&&!(chat&&chat.id===u.cid)?`<span class="bdg">${u.unread}</span>`:''}</div>`).join('')||'<p class="mut">لا توجد محادثات بعد. ابحث عن صديق وابدأ.</p>';
  });
}

/* ---------- feed ---------- */
function renderFeed(){
  const n=p=>Object.keys(p.likes||{}).length;

async function openChat(uid){

  sub(rt('users/'+uid+'/isOnline'),s=>{if(chat){chat.online=!!s.val();status()}});
  sub(rt(`chat_meta/${cid}/typing/${uid}`),s=>{if(!chat)return;const v=s.val();chat.typing=!!v&&Date.now()+skew-v<5000;status();clearTimeout(chat.tt);if(chat.typing)chat.tt=setTimeout(()=>{if(chat){chat.typing=false;status()}},5000)});
  sub(rt(`chat_meta/${cid}/reads/${uid}`),s=>{if(chat){chat.read=s.val()||0;draw()}});
  sub(query(rt('chats/'+cid),orderByChild('ts'),startAt(Date.now()-25*H),limitToLast(200)),s=>{

    if(!chat.first&&last&&last.id!==chat.lastId&&last.from!==me.uid)beep();

}

function draw(){
  if(!chat)return;
  const box=$('pmsgs'),near=chat.first||box.scrollHeight-box.scrollTop-box.clientHeight<120;
  let h='',day='';
  for(const m of chat.msgs){
    const mine=m.from===me.uid,t=typeof m.ts==='number'?m.ts:Date.now();
    const d=new Date(t).toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long'});
    if(d!==day){day=d;h+=`<small style="text-align:center">${esc(d)}</small>`}
    let b='';
    if(m.reply)b+=`<div class="q"><b>${esc(m.reply.name)}</b><br>${esc(m.reply.text)}</div>`;
    if(m.once)b+=mine?'<i>👻 صورة لمرة واحدة</i>':m.image?`<button data-act="once" data-id="${esc(m.id)}">👻 اضغط للعرض</button>`:'<i>👻 تم فتحها</i>';
    else{if(m.image)b+=`<img class="pimg" src="${esc(m.image)}" alt="">`;if(m.text)b+=`<p>${esc(m.text)}</p>`}
    const rx=Object.values(m.reactions||{});
    const tick=mine?(chat.read&&chat.read>=t?'✓✓':'✓'):'';
    const id=esc(m.id);
    h+=`<div class="msg ${mine?'me':''}">${b}${rx.length?`<span class="rx">${esc(rx.join(' '))}</span>`:''}<small>${fmt(t)} ${tick}</small><div class="acts"><span data-act="reply" data-id="${id}">رد</span><span data-act="react" data-id="${id}" data-e="❤️">❤️</span><span data-act="react" data-id="${id}" data-e="🔥">🔥</span>${mine?`<span data-act="unsend" data-id="${id}">حذف</span>`:''}</div></div>`;
  }
  box.innerHTML=h||'<p class="mut" style="text-align:center">ابدأ المحادثة. الرسائل تُعرض لمدة 25 ساعة.</p>';
  if(near)scrollEnd('pmsgs');
}

/* ---------- assistant: قاعدة البيانات -> أدوات مدمجة -> الويب ---------- */
let kb={},kbOk=false,asking=false;
const DIG='٠١٢٣٤٥٦٧٨٩';
const norm=s=>String(s).toLowerCase().replace(/[٠-٩]/g,d=>DIG.indexOf(d)).replace(/[إأآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/[\u064B-\u0652]/g,'').replace(/[^\p{L}\p{N}\s]/gu,' ').replace(/\s+/g,' ').trim();
const STOP=new Set('ما ماذا من هو هي هل ايه اية ازاي كيف في علي على عن الي الى هذا هذه ده دي يا لو انا انت اللي'.split(' ').map(norm));
const toks=s=>norm(s).split(' ').filter(w=>w&&!STOP.has(w));
const score=(a,b)=>{const A=new Set(toks(a)),B=new Set(toks(b));if(!A.size||!B.size)return 0;let i=0;A.forEach(w=>{if(B.has(w))i++});return i/(A.size+B.size-i)};
const cover=(a,b)=>{const A=new Set(toks(a)),B=new Set(toks(b));if(!A.size)return 0;let i=0;A.forEach(w=>{if(B.has(w))i++});return i/A.size};

const FAQ=[
 ['نشر منشور بوست صوره انشر','من تبويب الرئيسية اكتب في الصندوق واضغط «نشر». المنشورات تختفي من العرض بعد 72 ساعة.'],

];

function calc(q){
  const raw=(q.match(/[\d٠-٩(][\d٠-٩+\-*/×÷xX().^%\s,]*/)||[''])[0];
  if(!raw||q.replace(raw,'').length>25)return null;
  const s=raw.replace(/[٠-٩]/g,d=>DIG.indexOf(d)).replace(/[×xX]/g,'*').replace(/÷/g,'/').replace(/[\s,]/g,'');
  if(!/^[\d+\-*/().^%]+$/.test(s)||!/[+\-*/^%]/.test(s.replace(/^-/,'')))return null;
  let i=0;
  const atom=()=>{if(s[i]==='('){i++;const v=add();if(s[i++]!==')')throw 0;return v}const m=/^\d+(\.\d+)?/.exec(s.slice(i));if(!m)throw 0;i+=m[0].length;return +m[0]};
  const un=()=>s[i]==='-'?(i++,-un()):atom();
  const pw=()=>{const b=un();if(s[i]==='^'){i++;return Math.pow(b,pw())}return b};
  const mul=()=>{let v=pw();while('*/%'.includes(s[i]||'#')){const o=s[i++],r=pw();v=o==='*'?v*r:o==='/'?v/r:v%r}return v};
  const add=()=>{let v=mul();while('+-'.includes(s[i]||'#')){const o=s[i++],r=mul();v=o==='+'?v+r:v-r}return v};
  try{const v=add();return i===s.length&&isFinite(v)?+v.toFixed(10):null}catch{return null}
}
function tools(q){
  const n=norm(q);
  if(/^(اهلا|مرحبا|السلام|هاي|هلا|hi|hello)/.test(n))return 'أهلاً بك! اسألني عن التطبيق أو أي معلومة عامة، أو اكتب مسألة حسابية.';
  if(/(الساعه كام|كام الساعه|الوقت الان|what time)/.test(n))return 'الساعة الآن '+new Date().toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'});
  if(/(تاريخ اليوم|النهارده كام|اليوم ايه|ايه اليوم|النهارده ايه|today)/.test(n))return 'اليوم '+new Date().toLocaleDateString('ar-EG',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  return null;
}

async function getJSON(u,ms=6000){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);
  try{const r=await fetch(u,{signal:c.signal});if(!r.ok)throw new Error(r.status);return await r.json()}finally{clearTimeout(t)}
}
async function wiki(q,lang){
  const clean=toks(q).join(' ')||q;
  const j=await getJSON(`https://${lang}.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(clean)}&srlimit=5&format=json&origin=*`);
  const hits=(j.query?.search||[]).filter(h=>cover(clean,h.title+' '+h.snippet.replace(/<[^>]+>/g,''))>=.5);
  if(!hits.length)return null;
  const best=hits.map(h=>({h,s:score(clean,h.title)})).sort((a,b)=>b.s-a.s)[0].h;
  const t=best.title.replace(/ /g,'_');
  const s=await getJSON(`https://${lang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(t)}`);
  if(!s.extract||s.type==='disambiguation')return null;
  return{text:s.extract.length>500?s.extract.slice(0,500)+'...':s.extract,title:s.title,url:`https://${lang}.wikipedia.org/wiki/${encodeURIComponent(t)}`};
}
async function web(q){
  for(const lang of /[a-z]{3}/i.test(q)?['en','ar']:['ar','en']){
    try{const w=await wiki(q,lang);if(w)return{text:w.text,src:'ويكيبيديا: '+w.title,url:w.url}}catch{}
  }
  return null;
}

async function answer(q){
  const forced=q.replace(/^(ابحث|دور|search)(\s+في)?(\s+(الويب|النت|جوجل|الانترنت))?(\s+عن)?\s+/i,'');
  if(forced!==q){return await web(forced)||{text:'بحثت ولم أجد نتيجة موثوقة. جرّب صياغة أخرى.'}}
  // 1) قاعدة البيانات
  const nq=norm(q);let best=null,bs=0;
  for(const k in kb){const s=norm(k)===nq?1:score(q,k);if(s>bs){bs=s;best=k}}
  if(best&&bs>=.5)return{text:String(kb[best]),src:'قاعدة معرفة NXL'};
  // 2) أدوات مدمجة (حساب، وقت، دليل التطبيق)
  const c=calc(q);if(c!==null)return{text:'الناتج: '+c.toLocaleString('en-US',{maximumFractionDigits:10}),src:'حاسبة'};
  const t=tools(q);if(t)return{text:t};
  let f=null,fs=0;for(const[keys,ans]of FAQ){const s=cover(q,keys);if(s>fs){fs=s;f=ans}}
  if(f&&fs>=.5)return{text:f,src:'دليل التطبيق'};
  // 3) الويب
  return await web(q)||{text:'لم أجد إجابة موثوقة. جرّب صياغة أوضح، أو اكتب «ابحث عن ...».'};
}

  if(asking)return;const q=$('ain').value.trim();if(!q)return;
  $('ain').value='';say(q.slice(0,300),true);asking=true;$('asend').disabled=true;
  $('amsgs').insertAdjacentHTML('beforeend','<div id="ait" class="msg"><p>...</p></div>');scrollEnd('amsgs');
  let r;try{r=await answer(q)}catch{r={text:'حدث خطأ غير متوقع، حاول مرة أخرى.'}}
  $('ait')?.remove();say(r.text,false,r.src,r.url);asking=false;$('asend').disabled=false;
};
$('asend').onclick=ask;$('ain').onkeydown=e=>{if(e.key==='Enter')ask()};

/* ---------- one delegated click handler (no inline onclick = no injection) ---------- */
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');if(!el||!me)return;
  const id=el.dataset.id,act=el.dataset.act;
  try{
    if(act==='user')showUser(id);
    else if(act==='chat')openChat(id);
    else if(act==='like'){const r=rt(`posts/${id}/likes/${me.uid}`);(posts.find(p=>p.id===id)?.likes?.[me.uid])?await remove(r):await set(r,true)}
    else if(act==='delpost'){if(confirm('حذف المنشور؟'))await remove(rt('posts/'+id))}
    else if(act==='quiz'){qType=id;$('quiz').hidden=false;$('q-res').hidden=true;$('q-t').textContent=id==='love'?'ما أكثر صفة تعجبك في شريكك؟':'ما السر الذي تود قوله بصراحة؟'}
    else if(act==='reply'&&chat){const m=chat.msgs.find(x=>x.id===id);if(m){setReply({id,name:m.from===me.uid?'أنت':chat.u.nickname,text:(m.text||'📷 صورة').slice(0,80)});$('pin').focus()}}
    else if(act==='react'&&chat){const m=chat.msgs.find(x=>x.id===id),r=rt(`chats/${chat.id}/${id}/reactions/${me.uid}`);m?.reactions?.[me.uid]===el.dataset.e?await remove(r):await set(r,el.dataset.e)}
    else if(act==='unsend'&&chat){if(confirm('حذف الرسالة للطرفين؟'))await remove(rt(`chats/${chat.id}/${id}`))}
    else if(act==='once'&&chat){
      const p=`chats/${chat.id}/${id}`,img=(await get(rt(p+'/image'))).val();if(!img)return;
      $('once-img').src=img;$('once-v').classList.add('on');
      await update(rt(p),{image:null,seen:true});
    }
  }catch{toast('تعذر تنفيذ العملية')}
});
</script>
