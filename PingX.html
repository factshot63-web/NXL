<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#090d16" />
  <title>PingX — مراسلة فورية</title>
  <style>
    :root {
      --bg-main: #090d16;
      --bg-panel: #101726;
      --bg-card: #162033;
      --bg-msg-in: #1a253a;
      --bg-msg-out: linear-gradient(135deg, #00b894 0%, #00897b 100%);
      --accent: #00e5a8;
      --accent-soft: rgba(0, 229, 168, 0.14);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --border: rgba(148, 163, 184, 0.14);
      --danger: #ff5c77;
      --read-tick: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Arabic", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-main);
      color: var(--text-main);
      height: 100dvh;
      overflow: hidden;
    }

    button, input, textarea {
      font: inherit;
      color: inherit;
      border: none;
      outline: none;
      background: none;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    /* شاشة تسجيل الدخول والإنشاء */
    .auth-screen {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: radial-gradient(circle at top, rgba(0, 229, 168, 0.12), transparent 55%), var(--bg-main);
    }

    .auth-card {
      width: 100%;
      max-width: 410px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 28px 22px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    }

    .brand-header {
      text-align: center;
      margin-bottom: 22px;
    }

    .brand-logo {
      width: 58px;
      height: 58px;
      margin: 0 auto 10px;
      border-radius: 18px;
      background: linear-gradient(135deg, #00e5a8, #0284c7);
      color: #051018;
      font-weight: 800;
      font-size: 24px;
      display: grid;
      place-items: center;
      box-shadow: 0 8px 24px rgba(0, 229, 168, 0.25);
    }

    .brand-header h1 {
      font-size: 24px;
      letter-spacing: 0.4px;
    }

    .brand-header p {
      color: var(--text-muted);
      font-size: 13px;
      margin-top: 4px;
    }

    .auth-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--bg-main);
      padding: 4px;
      border-radius: 12px;
      margin-bottom: 18px;
      border: 1px solid var(--border);
    }

    .auth-tab {
      padding: 9px;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
      transition: 0.2s;
    }

    .auth-tab.active {
      background: var(--bg-card);
      color: var(--accent);
    }

    .field {
      margin-bottom: 13px;
    }

    .field label {
      display: block;
      font-size: 12.5px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .input {
      width: 100%;
      background: var(--bg-main);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px 14px;
      font-size: 14px;
      transition: border-color 0.2s;
    }

    .input:focus {
      border-color: var(--accent);
    }

    .btn-primary {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      background: linear-gradient(135deg, #00e5a8, #00b894);
      color: #041214;
      font-weight: 700;
      font-size: 15px;
      margin-top: 4px;
    }

    .error-msg {
      color: var(--danger);
      font-size: 12.5px;
      margin-top: 10px;
      min-height: 18px;
      text-align: center;
    }

    /* التخطيط الرئيسي للتطبيق */
    .app-shell {
      height: 100dvh;
      display: grid;
      grid-template-columns: 370px 1fr;
    }

    .sidebar {
      background: var(--bg-panel);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }

    .top-bar {
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      gap: 10px;
    }

    .me-info {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 1px solid var(--border);
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 15px;
      color: var(--accent);
      flex-shrink: 0;
      position: relative;
      overflow: hidden;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .online-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid var(--bg-panel);
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .me-text h2 {
      font-size: 15px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .me-text span {
      font-size: 12px;
      color: var(--text-muted);
      display: block;
    }

    .icon-actions {
      display: flex;
      gap: 6px;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      display: grid;
      place-items: center;
      font-size: 15px;
    }

    .icon-btn:hover {
      border-color: var(--accent);
    }

    /* شريط الحالات المؤقتة (24 ساعة) */
    .status-strip {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      background: rgba(9, 13, 22, 0.45);
    }

    .status-strip-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .status-list {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }

    .status-list::-webkit-scrollbar {
      display: none;
    }

    .status-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      width: 64px;
      flex-shrink: 0;
      text-align: center;
    }

    .status-ring {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      padding: 2px;
      background: linear-gradient(135deg, var(--accent), #38bdf8);
      display: grid;
      place-items: center;
    }

    .status-ring.add-ring {
      background: none;
      border: 1.5px dashed var(--accent);
      color: var(--accent);
      font-size: 20px;
    }

    .status-ring-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: var(--bg-card);
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 14px;
      color: var(--text-main);
    }

    .status-item span {
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }

    /* البحث وقائمة المحادثات */
    .search-box {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
    }

    .search-results {
      max-height: 180px;
      overflow-y: auto;
      margin-top: 8px;
      border-radius: 12px;
      background: var(--bg-main);
      border: 1px solid var(--border);
    }

    .search-row {
      padding: 9px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      font-size: 13.5px;
    }

    .search-row:last-child {
      border-bottom: none;
    }

    .search-row:hover {
      background: var(--bg-card);
    }

    .chats-list {
      flex: 1;
      overflow-y: auto;
    }

    .chat-item {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.07);
      cursor: pointer;
      transition: background 0.15s;
    }

    .chat-item:hover, .chat-item.active {
      background: var(--bg-card);
    }

    .chat-meta {
      flex: 1;
      min-width: 0;
    }

    .chat-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .chat-name {
      font-weight: 600;
      font-size: 14.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-time {
      font-size: 11px;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .chat-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
      gap: 8px;
    }

    .chat-preview {
      font-size: 13px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .unread-badge {
      background: var(--accent);
      color: #041214;
      font-size: 11px;
      font-weight: 800;
      min-width: 20px;
      height: 20px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      padding: 0 6px;
      flex-shrink: 0;
    }

    /* منطقة الشات */
    .chat-pane {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      background: radial-gradient(circle at 80% 10%, rgba(0, 229, 168, 0.06), transparent 45%), var(--bg-main);
      overflow: hidden;
    }

    .empty-chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      gap: 10px;
      padding: 24px;
      text-align: center;
    }

    .empty-chat h3 {
      color: var(--text-main);
      font-size: 19px;
    }

    .chat-header {
      padding: 12px 16px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-btn {
      display: none;
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--bg-card);
      place-items: center;
      font-size: 16px;
    }

    .peer-info h3 {
      font-size: 15.5px;
    }

    .peer-sub {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .peer-sub.typing {
      color: var(--accent);
      font-weight: 600;
    }

    .messages-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .msg-row {
      display: flex;
      flex-direction: column;
      max-width: min(76%, 520px);
    }

    .msg-row.out {
      align-self: flex-start;
    }

    .msg-row.in {
      align-self: flex-end;
    }

    .msg-bubble {
      padding: 10px 13px;
      border-radius: 16px;
      position: relative;
      word-break: break-word;
      line-height: 1.45;
      font-size: 14px;
    }

    .msg-row.out .msg-bubble {
      background: var(--bg-msg-out);
      color: #041512;
      font-weight: 500;
      border-bottom-right-radius: 4px;
    }

    .msg-row.in .msg-bubble {
      background: var(--bg-msg-in);
      color: var(--text-main);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    .reply-quote {
      background: rgba(0, 0, 0, 0.22);
      border-right: 3px solid var(--accent);
      padding: 6px 9px;
      border-radius: 8px;
      margin-bottom: 6px;
      font-size: 12px;
    }

    .msg-row.out .reply-quote {
      background: rgba(4, 21, 18, 0.16);
      border-right-color: #041512;
    }

    .msg-meta {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 5px;
      margin-top: 4px;
      font-size: 11px;
      opacity: 0.82;
    }

    .ticks.read {
      color: var(--read-tick);
      font-weight: 700;
    }

    .msg-row.out .ticks.read {
      color: #0ea5e9;
      background: rgba(255, 255, 255, 0.85);
      padding: 0 4px;
      border-radius: 6px;
    }

    .msg-actions {
      display: flex;
      gap: 8px;
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
      padding: 0 4px;
    }

    .msg-actions button:hover {
      color: var(--accent);
    }

    .reply-banner {
      background: var(--bg-card);
      border-top: 1px solid var(--border);
      padding: 8px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 12.5px;
    }

    .composer {
      padding: 10px 14px;
      background: var(--bg-panel);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: flex-end;
      gap: 10px;
    }

    .composer textarea {
      flex: 1;
      background: var(--bg-main);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 13px;
      resize: none;
      max-height: 110px;
      font-size: 14px;
      line-height: 1.4;
    }

    .composer textarea:focus {
      border-color: var(--accent);
    }

    .send-btn {
      width: 44px;
      height: 44px;
      border-radius: 13px;
      background: var(--accent);
      color: #041214;
      font-weight: 800;
      font-size: 17px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    /* نافذة منبثقة (ملف شخصي / حالة / عرض حالة) */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 50;
    }

    .modal-card {
      width: 100%;
      max-width: 390px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 22px;
    }

    .modal-card h3 {
      margin-bottom: 14px;
      font-size: 17px;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    .btn-secondary {
      flex: 1;
      padding: 10px;
      border-radius: 11px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      font-size: 13.5px;
    }

    @media (max-width: 820px) {
      .app-shell {
        grid-template-columns: 1fr;
      }

      .app-shell.in-chat .sidebar {
        display: none;
      }

      .app-shell:not(.in-chat) .chat-pane {
        display: none;
      }

      .back-btn {
        display: grid;
      }
    }
  </style>
</head>
<body>

  <!-- شاشة الدخول والإنشاء -->
  <section id="authScreen" class="auth-screen">
    <div class="auth-card">
      <div class="brand-header">
        <div class="brand-logo">PX</div>
        <h1>PingX</h1>
        <p>مراسلة فورية، حالات 24 ساعة، ومزامنة لحظية</p>
      </div>

      <div class="auth-tabs">
        <button id="tabLogin" class="auth-tab active" type="button">تسجيل الدخول</button>
        <button id="tabRegister" class="auth-tab" type="button">حساب جديد</button>
      </div>

      <form id="authForm">
        <div id="registerFields" class="hidden">
          <div class="field">
            <label>الاسم الظاهر</label>
            <input id="regName" class="input" type="text" placeholder="مثال: حمص" />
          </div>
          <div class="field">
            <label>اسم المستخدم (@username بدون مسافات)</label>
            <input id="regUsername" class="input" type="text" placeholder="مثال: hommos_px" />
          </div>
        </div>

        <div class="field">
          <label>البريد الإلكتروني</label>
          <input id="authEmail" class="input" type="email" required placeholder="name@example.com" />
        </div>

        <div class="field">
          <label>كلمة المرور</label>
          <input id="authPassword" class="input" type="password" required minlength="6" placeholder="6 أحرف أو أكثر" />
        </div>

        <button id="authSubmitBtn" class="btn-primary" type="submit">دخول إلى PingX</button>
        <div id="authError" class="error-msg"></div>
      </form>
    </div>
  </section>

  <!-- واجهة التطبيق الرئيسية -->
  <main id="appShell" class="app-shell hidden">
    <aside class="sidebar">
      <div class="top-bar">
        <div class="me-info">
          <div id="myAvatar" class="avatar">
            <span id="myAvatarText">P</span>
            <span class="online-dot"></span>
          </div>
          <div class="me-text">
            <h2 id="myName">جاري التحميل...</h2>
            <span id="myUsername">@username</span>
          </div>
        </div>
        <div class="icon-actions">
          <button id="openProfileBtn" class="icon-btn" title="الملف الشخصي" type="button">⚙️</button>
          <button id="logoutBtn" class="icon-btn" title="تسجيل الخروج" type="button">🚪</button>
        </div>
      </div>

      <div class="status-strip">
        <div class="status-strip-title">
          <span>الحالات (24 ساعة)</span>
          <span id="statusCountLabel">0 نشطة</span>
        </div>
        <div id="statusList" class="status-list"></div>
      </div>

      <div class="search-box">
        <input id="searchInput" class="input" type="search" placeholder="ابحث عن مستخدم بالاسم أو @username..." />
        <div id="searchResults" class="search-results hidden"></div>
      </div>

      <div id="chatsList" class="chats-list"></div>
    </aside>

    <section class="chat-pane">
      <div id="emptyChatState" class="empty-chat">
        <div class="brand-logo">PX</div>
        <h3>اختر محادثة أو ابحث عن صديق</h3>
        <p>كل الرسائل وحالات "يكتب الآن" و"متصل" تتحدث لحظياً عبر Firebase.</p>
      </div>

      <div id="activeChatView" class="hidden" style="display:flex;flex-direction:column;height:100%;">
        <div class="chat-header">
          <button id="backToListBtn" class="back-btn" type="button">→</button>
          <div id="peerAvatar" class="avatar">?</div>
          <div class="peer-info">
            <h3 id="peerName">المستخدم</h3>
            <div id="peerStatus" class="peer-sub">غير متصل</div>
          </div>
        </div>

        <div id="messagesArea" class="messages-area"></div>

        <div id="replyBanner" class="reply-banner hidden">
          <div>
            <strong>رد على <span id="replyAuthor"></span>:</strong>
            <div id="replyPreviewText" style="color:var(--text-muted);max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;"></div>
          </div>
          <button id="cancelReplyBtn" type="button">✕</button>
        </div>

        <form id="messageForm" class="composer">
          <textarea id="messageInput" rows="1" placeholder="اكتب رسالتك في PingX..."></textarea>
          <button class="send-btn" type="submit" title="إرسال">➤</button>
        </form>
      </div>
    </section>
  </main>

  <!-- نافذة تعديل الملف الشخصي -->
  <div id="profileModal" class="modal-backdrop hidden">
    <div class="modal-card">
      <h3>تعديل الملف الشخصي</h3>
      <div class="field">
        <label>الاسم الظاهر</label>
        <input id="editNameInput" class="input" type="text" />
      </div>
      <div class="field">
        <label>النبذة (Bio)</label>
        <input id="editBioInput" class="input" type="text" placeholder="اكتب نبذة قصيرة..." />
      </div>
      <div class="field">
        <label>رابط صورة شخصية (اختياري)</label>
        <input id="editAvatarUrlInput" class="input" type="url" placeholder="https://..." />
      </div>
      <div class="modal-actions">
        <button id="saveProfileBtn" class="btn-primary" style="margin-top:0;" type="button">حفظ</button>
        <button id="closeProfileBtn" class="btn-secondary" type="button">إلغاء</button>
      </div>
    </div>
  </div>

  <!-- نافذة إضافة / عرض حالة -->
  <div id="statusModal" class="modal-backdrop hidden">
    <div class="modal-card">
      <h3 id="statusModalTitle">حالة جديدة</h3>
      <div id="statusViewBox" class="hidden" style="margin-bottom:14px;">
        <p id="statusViewText" style="font-size:16px;line-height:1.5;background:var(--bg-main);padding:16px;border-radius:14px;border:1px solid var(--border);"></p>
        <small id="statusViewMeta" style="color:var(--text-muted);display:block;margin-top:8px;"></small>
      </div>
      <div id="statusCreateBox" class="hidden">
        <div class="field">
          <label>نص الحالة (يختفي بعد 24 ساعة)</label>
          <textarea id="statusTextInput" class="input" rows="3" maxlength="160" placeholder="إيه اللي في بالك دلوقتي؟"></textarea>
        </div>
      </div>
      <div class="modal-actions">
        <button id="publishStatusBtn" class="btn-primary hidden" style="margin-top:0;" type="button">نشر الحالة</button>
        <button id="closeStatusModalBtn" class="btn-secondary" type="button">إغلاق</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import {
      getDatabase,
      ref,
      set,
      get,
      push,
      update,
      remove,
      onValue,
      off,
      serverTimestamp,
      onDisconnect
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    // =========================================================
    // 1) ضع إعدادات مشروعك من Firebase Console هنا قبل التشغيل:
    // =========================================================
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    // صوت تنبيه خفيف بدون ملفات خارجية
    function playPingSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(740, ctx.currentTime);
        gain.gain.setValueAtTime(0.05, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.16);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.16);
      } catch (_) {}
    }

    // حالة التطبيق المحلية
    let mode = "login";
    let currentUser = null;
    let currentProfile = null;
    let allUsersMap = {};
    let activePeerId = null;
    let activeChatId = null;
    let replyTarget = null;
    let typingTimeout = null;
    let activeMessagesRef = null;
    let activeTypingRef = null;
    let activePeerUserRef = null;
    let lastRenderedMsgCount = 0;

    // عناصر الواجهة
    const authScreen = document.getElementById("authScreen");
    const appShell = document.getElementById("appShell");
    const tabLogin = document.getElementById("tabLogin");
    const tabRegister = document.getElementById("tabRegister");
    const registerFields = document.getElementById("registerFields");
    const authForm = document.getElementById("authForm");
    const authSubmitBtn = document.getElementById("authSubmitBtn");
    const authError = document.getElementById("authError");

    const myNameEl = document.getElementById("myName");
    const myUsernameEl = document.getElementById("myUsername");
    const myAvatarEl = document.getElementById("myAvatar");
    const statusListEl = document.getElementById("statusList");
    const statusCountLabel = document.getElementById("statusCountLabel");
    const searchInput = document.getElementById("searchInput");
    const searchResultsEl = document.getElementById("searchResults");
    const chatsListEl = document.getElementById("chatsList");

    const emptyChatState = document.getElementById("emptyChatState");
    const activeChatView = document.getElementById("activeChatView");
    const backToListBtn = document.getElementById("backToListBtn");
    const peerAvatarEl = document.getElementById("peerAvatar");
    const peerNameEl = document.getElementById("peerName");
    const peerStatusEl = document.getElementById("peerStatus");
    const messagesArea = document.getElementById("messagesArea");
    const replyBanner = document.getElementById("replyBanner");
    const replyAuthorEl = document.getElementById("replyAuthor");
    const replyPreviewTextEl = document.getElementById("replyPreviewText");
    const cancelReplyBtn = document.getElementById("cancelReplyBtn");
    const messageForm = document.getElementById("messageForm");
    const messageInput = document.getElementById("messageInput");

    const profileModal = document.getElementById("profileModal");
    const editNameInput = document.getElementById("editNameInput");
    const editBioInput = document.getElementById("editBioInput");
    const editAvatarUrlInput = document.getElementById("editAvatarUrlInput");
    const saveProfileBtn = document.getElementById("saveProfileBtn");
    const closeProfileBtn = document.getElementById("closeProfileBtn");

    const statusModal = document.getElementById("statusModal");
    const statusModalTitle = document.getElementById("statusModalTitle");
    const statusViewBox = document.getElementById("statusViewBox");
    const statusViewText = document.getElementById("statusViewText");
    const statusViewMeta = document.getElementById("statusViewMeta");
    const statusCreateBox = document.getElementById("statusCreateBox");
    const statusTextInput = document.getElementById("statusTextInput");
    const publishStatusBtn = document.getElementById("publishStatusBtn");
    const closeStatusModalBtn = document.getElementById("closeStatusModalBtn");

    // تبديل تبويب الدخول / التسجيل
    tabLogin.addEventListener("click", () => {
      mode = "login";
      tabLogin.classList.add("active");
      tabRegister.classList.remove("active");
      registerFields.classList.add("hidden");
      authSubmitBtn.textContent = "دخول إلى PingX";
      authError.textContent = "";
    });

    tabRegister.addEventListener("click", () => {
      mode = "register";
      tabRegister.classList.add("active");
      tabLogin.classList.remove("active");
      registerFields.classList.remove("hidden");
      authSubmitBtn.textContent = "إنشاء حساب جديد";
      authError.textContent = "";
    });

    // تنفيذ الدخول أو التسجيل
    authForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      authError.textContent = "";
      const email = document.getElementById("authEmail").value.trim();
      const password = document.getElementById("authPassword").value;

      try {
        if (mode === "register") {
          const name = document.getElementById("regName").value.trim();
          const rawUsername = document.getElementById("regUsername").value.trim().toLowerCase().replace(/^@+/, "");
          if (!name || !/^[a-z0-9_]{3,20}$/.test(rawUsername)) {
            authError.textContent = "اكتب اسمك، واسم مستخدم إنجليزي من 3 إلى 20 حرف/رقم أو _";
            return;
          }

          const unameSnap = await get(ref(db, `usernames/${rawUsername}`));
          if (unameSnap.exists()) {
            authError.textContent = "اسم المستخدم ده محجوز بالفعل، جرب اسم تاني.";
            return;
          }

          const cred = await createUserWithEmailAndPassword(auth, email, password);
          const uid = cred.user.uid;
          await set(ref(db, `users/${uid}`), {
            name,
            username: rawUsername,
            bio: "أستخدم PingX",
            avatarUrl: "",
            statusText: "",
            statusUpdatedAt: 0,
            online: true,
            lastSeen: Date.now()
          });
          await set(ref(db, `usernames/${rawUsername}`), uid);
        } else {
          await signInWithEmailAndPassword(auth, email, password);
        }
      } catch (err) {
        authError.textContent = err.message || "حدث خطأ أثناء المصادقة.";
      }
    });

    // مراقبة حالة المستخدم وحالة الاتصال (Presence)
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        authScreen.classList.add("hidden");
        appShell.classList.remove("hidden");

        const userRef = ref(db, `users/${user.uid}`);
        const snap = await get(userRef);
        if (!snap.exists()) {
          const fallbackName = user.email.split("@")[0];
          const fallbackUname = `${fallbackName.replace(/[^a-z0-9_]/gi, "").toLowerCase()}_${user.uid.slice(0, 4)}`;
          await set(userRef, {
            name: fallbackName,
            username: fallbackUname,
            bio: "أستخدم PingX",
            avatarUrl: "",
            statusText: "",
            statusUpdatedAt: 0,
            online: true,
            lastSeen: Date.now()
          });
          await set(ref(db, `usernames/${fallbackUname}`), user.uid);
        }

        // ربط حالة الاتصال والانقطاع تلقائياً
        const connectedRef = ref(db, ".info/connected");
        onValue(connectedRef, (s) => {
          if (s.val() === true) {
            update(userRef, { online: true });
            onDisconnect(userRef).update({
              online: false,
              lastSeen: serverTimestamp()
            });
          }
        });

        listenUsers();
        listenMyChats();
      } else {
        currentUser = null;
        currentProfile = null;
        activePeerId = null;
        activeChatId = null;
        appShell.classList.add("hidden");
        appShell.classList.remove("in-chat");
        authScreen.classList.remove("hidden");
      }
    });

    // الاستماع لكل المستخدمين لتحديث الحالات والبيانات والبحث
    function listenUsers() {
      onValue(ref(db, "users"), (snap) => {
        allUsersMap = snap.val() || {};
        if (currentUser && allUsersMap[currentUser.uid]) {
          currentProfile = allUsersMap[currentUser.uid];
          renderMyHeader();
        }
        renderStatuses();
        renderSearchResults(searchInput.value.trim().toLowerCase());
      });
    }

    function renderAvatarElement(el, userObj, showOnline = false) {
      const letter = (userObj?.name || "?").trim().charAt(0).toUpperCase() || "?";
      let html = userObj?.avatarUrl
        ? `<img src="${escapeAttr(userObj.avatarUrl)}" alt="" onerror="this.remove()" /><span>${escapeHtml(letter)}</span>`
        : `<span>${escapeHtml(letter)}</span>`;
      if (showOnline && userObj?.online) {
        html += `<span class="online-dot"></span>`;
      }
      el.innerHTML = html;
    }

    function renderMyHeader() {
      if (!currentProfile) return;
      myNameEl.textContent = currentProfile.name;
      myUsernameEl.textContent = `@${currentProfile.username}`;
      renderAvatarElement(myAvatarEl, currentProfile, true);
    }

    // عرض حالات الـ 24 ساعة
    function renderStatuses() {
      if (!currentUser) return;
      const now = Date.now();
      const dayMs = 24 * 60 * 60 * 1000;
      const activeStatuses = [];

      Object.entries(allUsersMap).forEach(([uid, u]) => {
        if (u.statusText && u.statusUpdatedAt && (now - u.statusUpdatedAt) < dayMs) {
          activeStatuses.push({ uid, ...u });
        }
      });

      statusCountLabel.textContent = `${activeStatuses.length} نشطة`;
      statusListEl.innerHTML = "";

      // زر إضافة حالتي
      const addBtn = document.createElement("button");
      addBtn.type = "button";
      addBtn.className = "status-item";
      addBtn.innerHTML = `<div class="status-ring add-ring">+</div><span>حالتي</span>`;
      addBtn.addEventListener("click", () => openCreateStatusModal());
      statusListEl.appendChild(addBtn);

      activeStatuses.forEach((st) => {
        const item = document.createElement("button");
        item.type = "button";
        item.className = "status-item";
        const initial = (st.name || "?").charAt(0).toUpperCase();
        item.innerHTML = `
          <div class="status-ring"><div class="status-ring-inner">${escapeHtml(initial)}</div></div>
          <span>${st.uid === currentUser.uid ? "أنت" : escapeHtml(st.name)}</span>
        `;
        item.addEventListener("click", () => openViewStatusModal(st));
        statusListEl.appendChild(item);
      });
    }

    function openCreateStatusModal() {
      statusModalTitle.textContent = "نشر حالة لمدة 24 ساعة";
      statusViewBox.classList.add("hidden");
      statusCreateBox.classList.remove("hidden");
      publishStatusBtn.classList.remove("hidden");
      statusTextInput.value = currentProfile?.statusText || "";
      statusModal.classList.remove("hidden");
    }

    function openViewStatusModal(st) {
      statusModalTitle.textContent = `حالة ${st.name} (@${st.username})`;
      statusCreateBox.classList.add("hidden");
      publishStatusBtn.classList.add("hidden");
      statusViewBox.classList.remove("hidden");
      statusViewText.textContent = st.statusText;
      const minsAgo = Math.max(1, Math.floor((Date.now() - st.statusUpdatedAt) / 60000));
      statusViewMeta.textContent = `منذ ${minsAgo} دقيقة • تختفي تلقائياً بعد 24 ساعة`;
      statusModal.classList.remove("hidden");
    }

    publishStatusBtn.addEventListener("click", async () => {
      if (!currentUser) return;
      const txt = statusTextInput.value.trim();
      await update(ref(db, `users/${currentUser.uid}`), {
        statusText: txt,
        statusUpdatedAt: txt ? Date.now() : 0
      });
      statusModal.classList.add("hidden");
    });

    closeStatusModalBtn.addEventListener("click", () => statusModal.classList.add("hidden"));

    // البحث عن مستخدمين
    searchInput.addEventListener("input", () => {
      renderSearchResults(searchInput.value.trim().toLowerCase().replace(/^@+/, ""));
    });

    function renderSearchResults(q) {
      if (!q || !currentUser) {
        searchResultsEl.classList.add("hidden");
        searchResultsEl.innerHTML = "";
        return;
      }

      const matches = Object.entries(allUsersMap)
        .filter(([uid, u]) => uid !== currentUser.uid && (
          (u.name || "").toLowerCase().includes(q) ||
          (u.username || "").toLowerCase().includes(q)
        ))
        .slice(0, 8);

      searchResultsEl.innerHTML = "";
      if (!matches.length) {
        searchResultsEl.innerHTML = `<div class="search-row"><span style="color:var(--text-muted)">لا توجد نتائج مطابقة</span></div>`;
        searchResultsEl.classList.remove("hidden");
        return;
      }

      matches.forEach(([uid, u]) => {
        const row = document.createElement("div");
        row.className = "search-row";
        row.innerHTML = `<div><strong>${escapeHtml(u.name)}</strong> <small style="color:var(--text-muted)">@${escapeHtml(u.username)}</small></div><span style="color:var(--accent)">مراسلة</span>`;
        row.addEventListener("click", () => {
          searchInput.value = "";
          searchResultsEl.classList.add("hidden");
          openChatWithUser(uid);
        });
        searchResultsEl.appendChild(row);
      });
      searchResultsEl.classList.remove("hidden");
    }

    // الاستماع لقائمة محادثاتي
    function listenMyChats() {
      if (!currentUser) return;
      onValue(ref(db, `userChats/${currentUser.uid}`), (snap) => {
        const raw = snap.val() || {};
        const entries = Object.entries(raw).sort((a, b) => (b[1].lastMessageAt || 0) - (a[1].lastMessageAt || 0));
        chatsListEl.innerHTML = "";

        if (!entries.length) {
          chatsListEl.innerHTML = `<div style="padding:24px;text-align:center;color:var(--text-muted);font-size:13.5px;">لا توجد محادثات بعد. ابحث عن صديق لبدء أول شات.</div>`;
          return;
        }

        entries.forEach(([peerId, meta]) => {
          const peer = allUsersMap[peerId] || { name: "مستخدم", username: "user", online: false };
          const item = document.createElement("div");
          item.className = `chat-item ${peerId === activePeerId ? "active" : ""}`;

          const av = document.createElement("div");
          av.className = "avatar";
          renderAvatarElement(av, peer, true);

          const unread = meta.unreadCount || 0;
          const timeStr = meta.lastMessageAt ? formatTime(meta.lastMessageAt) : "";

          item.innerHTML += `
            <div class="chat-meta">
              <div class="chat-top">
                <span class="chat-name">${escapeHtml(peer.name)}</span>
                <span class="chat-time">${escapeHtml(timeStr)}</span>
              </div>
              <div class="chat-bottom">
                <span class="chat-preview">${escapeHtml(meta.lastMessage || "")}</span>
                ${unread > 0 ? `<span class="unread-badge">${unread}</span>` : ""}
              </div>
            </div>
          `;
          item.prepend(av);
          item.addEventListener("click", () => openChatWithUser(peerId));
          chatsListEl.appendChild(item);
        });
      });
    }

    function buildChatId(uidA, uidB) {
      return [uidA, uidB].sort().join("_");
    }

    // فتح غرفة محادثة مع مستخدم
    async function openChatWithUser(peerId) {
      if (!currentUser || peerId === currentUser.uid) return;
      activePeerId = peerId;
      activeChatId = buildChatId(currentUser.uid, peerId);
      lastRenderedMsgCount = 0;
      clearReply();

      emptyChatState.classList.add("hidden");
      activeChatView.classList.remove("hidden");
      appShell.classList.add("in-chat");

      // تصفير عداد الرسائل غير المقروءة
      await update(ref(db, `userChats/${currentUser.uid}/${peerId}`), { unreadCount: 0 });

      // إزالة المستمعات السابقة
      if (activeMessagesRef) off(activeMessagesRef);
      if (activeTypingRef) off(activeTypingRef);
      if (activePeerUserRef) off(activePeerUserRef);

      activePeerUserRef = ref(db, `users/${peerId}`);
      activeTypingRef = ref(db, `chats/${activeChatId}/typing/${peerId}`);
      activeMessagesRef = ref(db, `chats/${activeChatId}/messages`);

      let peerOnline = false;
      let peerLastSeen = 0;
      let peerTyping = false;

      function refreshPeerSub() {
        if (peerTyping) {
          peerStatusEl.textContent = "يكتب الآن...";
          peerStatusEl.classList.add("typing");
        } else {
          peerStatusEl.classList.remove("typing");
          peerStatusEl.textContent = peerOnline
            ? "متصل الآن"
            : (peerLastSeen ? `آخر ظهور ${formatTime(peerLastSeen)}` : "غير متصل");
        }
      }

      onValue(activePeerUserRef, (snap) => {
        const p = snap.val() || {};
        peerNameEl.textContent = p.name || "مستخدم";
        renderAvatarElement(peerAvatarEl, p, true);
        peerOnline = !!p.online;
        peerLastSeen = p.lastSeen || 0;
        refreshPeerSub();
      });

      onValue(activeTypingRef, (snap) => {
        peerTyping = !!snap.val();
        refreshPeerSub();
      });

      onValue(activeMessagesRef, (snap) => {
        const msgs = snap.val() || {};
        const list = Object.entries(msgs).map(([id, m]) => ({ id, ...m }))
          .sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));

        if (list.length > lastRenderedMsgCount && lastRenderedMsgCount > 0) {
          const lastMsg = list[list.length - 1];
          if (lastMsg.senderId !== currentUser.uid) {
            playPingSound();
          }
        }
        lastRenderedMsgCount = list.length;

        renderMessages(list);
      });
    }

    backToListBtn.addEventListener("click", () => {
      appShell.classList.remove("in-chat");
      activePeerId = null;
    });

    function renderMessages(list) {
      messagesArea.innerHTML = "";
      list.forEach((m) => {
        const isOut = m.senderId === currentUser.uid;

        // تحديث حالة الرسالة إلى مقروءة إذا كانت واردة ولم تُقرأ بعد
        if (!isOut && m.status !== "read" && !m.deleted) {
          update(ref(db, `chats/${activeChatId}/messages/${m.id}`), { status: "read" });
          update(ref(db, `userChats/${currentUser.uid}/${activePeerId}`), { unreadCount: 0 });
        }

        const row = document.createElement("div");
        row.className = `msg-row ${isOut ? "out" : "in"}`;

        const bubble = document.createElement("div");
        bubble.className = "msg-bubble";

        if (m.deleted) {
          bubble.innerHTML = `<em style="opacity:0.75;">تم حذف هذه الرسالة</em>`;
        } else {
          let inner = "";
          if (m.replyTo && m.replyTo.text) {
            inner += `<div class="reply-quote"><strong>${escapeHtml(m.replyTo.senderName || "")}</strong><div>${escapeHtml(m.replyTo.text)}</div></div>`;
          }
          inner += `<div>${escapeHtml(m.text || "")}</div>`;

          const ticks = isOut
            ? `<span class="ticks ${m.status === "read" ? "read" : ""}">${m.status === "read" ? "✓✓" : (m.status === "delivered" ? "✓✓" : "✓")}</span>`
            : "";

          inner += `<div class="msg-meta"><span>${escapeHtml(formatTime(m.createdAt || Date.now()))}</span>${ticks}</div>`;
          bubble.innerHTML = inner;
        }

        row.appendChild(bubble);

        if (!m.deleted) {
          const actions = document.createElement("div");
          actions.className = "msg-actions";
          const replyBtn = document.createElement("button");
          replyBtn.type = "button";
          replyBtn.textContent = "رد";
          replyBtn.addEventListener("click", () => setReply(m));
          actions.appendChild(replyBtn);

          if (isOut) {
            const delBtn = document.createElement("button");
            delBtn.type = "button";
            delBtn.textContent = "حذف";
            delBtn.addEventListener("click", () => {
              update(ref(db, `chats/${activeChatId}/messages/${m.id}`), {
                text: "",
                deleted: true
              });
            });
            actions.appendChild(delBtn);
          }
          row.appendChild(actions);
        }

        messagesArea.appendChild(row);
      });

      messagesArea.scrollTop = messagesArea.scrollHeight;
    }

    function setReply(msg) {
      const senderObj = allUsersMap[msg.senderId];
      replyTarget = {
        id: msg.id,
        senderName: msg.senderId === currentUser.uid ? "أنت" : (senderObj?.name || "مستخدم"),
        text: msg.text
      };
      replyAuthorEl.textContent = replyTarget.senderName;
      replyPreviewTextEl.textContent = replyTarget.text;
      replyBanner.classList.remove("hidden");
      messageInput.focus();
    }

    function clearReply() {
      replyTarget = null;
      replyBanner.classList.add("hidden");
    }

    cancelReplyBtn.addEventListener("click", clearReply);

    // مؤشر "يكتب الآن..."
    messageInput.addEventListener("input", () => {
      messageInput.style.height = "auto";
      messageInput.style.height = Math.min(messageInput.scrollHeight, 110) + "px";

      if (!currentUser || !activeChatId) return;
      const myTypingRef = ref(db, `chats/${activeChatId}/typing/${currentUser.uid}`);
      set(myTypingRef, true);
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => set(myTypingRef, false), 1500);
    });

    // إرسال رسالة جديدة
    messageForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!currentUser || !activePeerId || !activeChatId) return;
      const text = messageInput.value.trim();
      if (!text) return;

      const now = Date.now();
      const payload = {
        senderId: currentUser.uid,
        text,
        replyTo: replyTarget,
        createdAt: now,
        status: "sent",
        deleted: false
      };

      await push(ref(db, `chats/${activeChatId}/messages`), payload);
      await set(ref(db, `chats/${activeChatId}/typing/${currentUser.uid}`), false);

      // تحديث قائمة المحادثات للطرفين
      await update(ref(db, `userChats/${currentUser.uid}/${activePeerId}`), {
        chatId: activeChatId,
        lastMessage: text,
        lastMessageAt: now,
        unreadCount: 0
      });

      const peerChatSnap = await get(ref(db, `userChats/${activePeerId}/${currentUser.uid}`));
      const prevUnread = peerChatSnap.exists() ? (peerChatSnap.val().unreadCount || 0) : 0;

      await update(ref(db, `userChats/${activePeerId}/${currentUser.uid}`), {
        chatId: activeChatId,
        lastMessage: text,
        lastMessageAt: now,
        unreadCount: prevUnread + 1
      });

      messageInput.value = "";
      messageInput.style.height = "auto";
      clearReply();
    });

    // تعديل الملف الشخصي
    document.getElementById("openProfileBtn").addEventListener("click", () => {
      if (!currentProfile) return;
      editNameInput.value = currentProfile.name || "";
      editBioInput.value = currentProfile.bio || "";
      editAvatarUrlInput.value = currentProfile.avatarUrl || "";
      profileModal.classList.remove("hidden");
    });

    closeProfileBtn.addEventListener("click", () => profileModal.classList.add("hidden"));

    saveProfileBtn.addEventListener("click", async () => {
      if (!currentUser) return;
      const name = editNameInput.value.trim();
      if (!name) return;
      await update(ref(db, `users/${currentUser.uid}`), {
        name,
        bio: editBioInput.value.trim(),
        avatarUrl: editAvatarUrlInput.value.trim()
      });
      profileModal.classList.add("hidden");
    });

    // تسجيل الخروج
    document.getElementById("logoutBtn").addEventListener("click", async () => {
      if (currentUser) {
        await update(ref(db, `users/${currentUser.uid}`), {
          online: false,
          lastSeen: Date.now()
        });
      }
      await signOut(auth);
    });

    function formatTime(ts) {
      const d = new Date(ts);
      if (Number.isNaN(d.getTime())) return "";
      return d.toLocaleTimeString("ar-EG", { hour: "2-digit", minute: "2-digit" });
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function escapeAttr(str) {
      return String(str).replace(/"/g, "&quot;");
    }
  </script>
</body>
</html>
